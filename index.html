<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصروف البيت</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--tx:#1b2a1f;--tx2:#6b7a70;--g:#3f8f66;--g2:#e3f1e8;--gd:#256a47;--bd:#e2e9e4;--red:#b73a2c;--redbg:#fbe9e7;--amb:#8a5a0b;--ambbg:#fdf1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a15;--card:#1b2620;--tx:#e8f0ea;--tx2:#9fb0a5;--g:#5db589;--g2:#233a2d;--gd:#8fd6af;--bd:#2c3a32;--red:#f0897d;--redbg:#3a2220;--amb:#f0c36d;--ambbg:#3a3017}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121a15;--card:#1b2620;--tx:#e8f0ea;--tx2:#9fb0a5;--g:#5db589;--g2:#233a2d;--gd:#8fd6af;--bd:#2c3a32;--red:#f0897d;--redbg:#3a2220;--amb:#f0c36d;--ambbg:#3a3017}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5}
.app{max-width:480px;margin:0 auto;padding:16px 16px 150px}
h1{font-size:20px;margin:0;font-weight:600}
h2{font-size:15px;margin:22px 0 10px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#1f6b47,#7cc47a);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.hero small{opacity:.85}
.hero .big{font-size:34px;font-weight:700;margin:2px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.m{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.m small,.sub{color:var(--tx2);font-size:12px}
.m b{display:block;font-size:18px;margin-top:2px}
.pos{color:var(--gd)}.neg{color:var(--red)}
.av{width:38px;height:38px;border-radius:50%;background:var(--g2);color:var(--gd);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--g2);color:var(--gd)}
.tag.r{background:var(--redbg);color:var(--red)}.tag.a{background:var(--ambbg);color:var(--amb)}
.bar{height:8px;background:var(--g2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 14px}
button.p{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{white-space:nowrap;padding:6px 14px;border-radius:20px}
.chips button.on{background:var(--g2);color:var(--gd);border-color:var(--g)}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.mini{display:flex;gap:6px;margin-top:8px}.mini input{padding:7px 10px}
.err{color:var(--red);font-size:12px;margin-top:6px;min-height:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;padding:6px 4px}
nav button{border:0;background:none;font-size:11px;color:var(--tx2);padding:6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{background:var(--g2);color:var(--gd);font-weight:600}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,calc(50% - 224px));background:var(--g);color:#fff;border:0;border-radius:28px;padding:13px 22px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
#ov.show{display:flex}
#sh{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;z-index:12;display:none}
</style>
</head>
<body>
<div class="app" id="main"></div>
<button class="fab" id="fab">+ إضافة عملية</button>
<nav><div id="nav"></div></nav>
<div id="ov"><div id="sh"></div></div>
<div class="toast" id="toast"></div>
<script>
var D=86400000,now=Date.now();
var S={fund:650000,m:[{n:'الأب',b:100000},{n:'الأم',b:40000},{n:'أحمد',b:25000},{n:'سارة',b:10000}],
log:[
{t:'income',who:'الأب',amt:500000,txt:'راتب الشهر',ts:now-20*D,cat:''},
{t:'income',who:'الأم',amt:300000,txt:'مساهمة شهرية',ts:now-20*D,cat:''},
{t:'expense',who:'الأم',amt:50000,txt:'مواد غذائية',ts:now-6*D,cat:'طعام'},
{t:'expense',who:'الأب',amt:35000,txt:'فاتورة الكهرباء',ts:now-3*D,cat:'كهرباء وماء'},
{t:'withdraw',who:'الأب',amt:100000,txt:'مصروف شخصي',ts:now-2*D,cat:''},
{t:'expense',who:'أحمد',amt:15000,txt:'مواصلات',ts:now-1*D,cat:'مواصلات'}],
debts:[{id:1,debtor:'أحمد',cred:'الأب',amt:30000,paid:0,ts:now-9*D},{id:2,debtor:'العائلة',cred:'محل أبو علي',amt:200000,paid:50000,ts:now-12*D}],
goals:[{n:'صندوق الطوارئ',tg:2000000,sv:500000},{n:'تجديد المنزل',tg:1500000,sv:300000}]};
var cats=['طعام','كهرباء وماء','إنترنت','إيجار','أدوية','صيانة','مواصلات','أخرى'];
var types={income:'إضافة دخل',expense:'تسجيل مصروف',withdraw:'سحب من الصندوق',transfer:'تحويل بين الأفراد',debt:'تسجيل دين',goal:'ادخار لهدف'};
var pg='home',per='month',ft='all',typ='expense';
var pages=[['home','الرئيسية','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['fam','العائلة','M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M17 3a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.6'],['debt','الديون','M3 7h18v12H3zM3 11h18M7 15h3'],['rep','التقارير','M4 20V10M10 20V4M16 20v-7M22 20H2'],['log','السجل','M5 4h14v16H5zM9 9h6M9 13h6M9 17h3']];
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(n){return Math.round(n).toLocaleString('en-US')}
function mem(n){return S.m.filter(function(x){return x.n===n})[0]}
function dt(ts){var d=new Date(ts);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},2200)}
function ico(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+p+'"/></svg>'}
function opts(a){return a.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')}
function names(){return S.m.map(function(x){return x.n})}
function ent(e){var s=e.t==='income'?'+':(e.t==='transfer'||e.t==='debt'?'':'-');var c=e.t==='income'?'pos':(e.t==='expense'||e.t==='debtpay'?'neg':'');
var lb={income:'دخل',expense:'مصروف',withdraw:'سحب',transfer:'تحويل',debt:'دين',debtpay:'تسديد',goal:'ادخار'}[e.t];
return '<div class="item"><div class="av">'+esc((e.who||'؟').charAt(0))+'</div><div class="grow"><b>'+esc(e.txt)+'</b><div class="sub">'+esc(e.who)+' · '+dt(e.ts)+'</div></div><div style="text-align:left"><b class="'+c+'">'+s+f(e.amt)+'</b><div><span class="tag">'+lb+'</span></div></div></div>'}
function sum(t,from){return S.log.filter(function(e){return e.t===t&&e.ts>=from}).reduce(function(a,e){return a+e.amt},0)}
function owed(){return S.debts.reduce(function(a,d){return a+d.amt-d.paid},0)}
function home(){var inc=sum('income',0),exp=sum('expense',0)+S.log.filter(function(e){return e.t==='debtpay'}).reduce(function(a,e){return a+e.amt},0);
var h='<div class="hero"><small>رصيد صندوق البيت</small><div class="big">'+f(S.fund)+' د.ع</div><div class="row"><small>'+S.m.length+' أفراد في العائلة</small><small>آخر تحديث: اليوم</small></div></div>';
h+='<div class="grid"><div class="m"><small>إجمالي الدخل</small><b class="pos">'+f(inc)+'</b></div><div class="m"><small>إجمالي المصروفات</small><b class="neg">'+f(exp)+'</b></div><div class="m"><small>الديون المستحقة</small><b>'+f(owed())+'</b></div><div class="m"><small>مصروف اليوم</small><b>'+f(sum('expense',new Date().setHours(0,0,0,0)))+'</b></div></div>';
h+='<h2>أرصدة الأفراد</h2><div class="card">'+S.m.map(function(x){return '<div class="item"><div class="av">'+esc(x.n.charAt(0))+'</div><div class="grow"><b>'+esc(x.n)+'</b></div><b>'+f(x.b)+'</b></div>'}).join('')+'</div>';
h+='<h2>آخر العمليات</h2><div class="card">'+S.log.slice(-4).reverse().map(ent).join('')+'</div>';return h}
function fam(){var h='<h2>أفراد العائلة</h2>'+S.m.map(function(x){return '<div class="card row"><div class="row" style="gap:10px"><div class="av">'+esc(x.n.charAt(0))+'</div><div><b>'+esc(x.n)+'</b><div class="sub">الرصيد الشخصي</div></div></div><b class="pos">'+f(x.b)+' د.ع</b></div>'}).join('');
h+='<div class="card"><label>إضافة فرد جديد</label><div class="mini"><input id="nm" placeholder="الاسم الكامل"><button class="p" onclick="addM()">إضافة</button></div><div class="err" id="e2"></div></div>';
h+='<button class="p" style="width:100%" onclick="openSh(\'transfer\')">تحويل بين الأفراد</button>';return h}
function addM(){var v=$('nm').value.trim();if(!v){$('e2').textContent='اكتب اسم الفرد أولاً';return}if(mem(v)){$('e2').textContent='هذا الاسم موجود';return}S.m.push({n:v,b:0});toast('تمت إضافة '+v);render()}
function debt(){var op=S.debts.filter(function(d){return d.paid<d.amt}),cl=S.debts.filter(function(d){return d.paid>=d.amt});
var h='<div class="grid"><div class="m"><small>إجمالي المستحق</small><b class="neg">'+f(owed())+'</b></div><div class="m"><small>ديون مدفوعة</small><b class="pos">'+f(S.debts.reduce(function(a,d){return a+d.paid},0))+'</b></div></div><h2>ديون مستحقة</h2>';
h+=op.length?op.map(function(d){var r=d.amt-d.paid,src=mem(d.debtor)?d.debtor:'الصندوق';
return '<div class="card"><div class="row"><b>'+esc(d.debtor)+' ← '+esc(d.cred)+'</b><span class="tag a">متبقي '+f(r)+'</span></div><div class="sub">الأصل '+f(d.amt)+' · مدفوع '+f(d.paid)+' · '+dt(d.ts)+'</div><div class="bar"><i style="width:'+Math.round(d.paid/d.amt*100)+'%"></i></div><div class="mini"><input type="number" inputmode="numeric" id="pa'+d.id+'" placeholder="المبلغ"><select id="ps'+d.id+'" style="width:120px"><option'+(src==='الصندوق'?' selected':'')+'>الصندوق</option>'+S.m.map(function(x){return '<option'+(src===x.n?' selected':'')+'>'+esc(x.n)+'</option>'}).join('')+'</select><button class="p" onclick="pay('+d.id+')">تسديد</button></div><div class="err" id="pe'+d.id+'"></div></div>'}).join(''):'<div class="card sub">لا توجد ديون مستحقة.</div>';
h+='<h2>ديون سابقة</h2>'+(cl.length?cl.map(function(d){return '<div class="card row"><b>'+esc(d.debtor)+' ← '+esc(d.cred)+'</b><span class="tag">تم دفع الدين</span></div>'}).join(''):'<div class="card sub">لا توجد ديون مسددة بعد.</div>');
return h+'<button class="p" style="width:100%" onclick="openSh(\'debt\')">تسجيل دين جديد</button>'}
function pay(id){var d=S.debts.filter(function(x){return x.id===id})[0],a=+$('pa'+id).value,s=$('ps'+id).value,r=d.amt-d.paid,e=$('pe'+id);
if(!(a>0)){e.textContent='أدخل مبلغاً صحيحاً';return}if(a>r){e.textContent='المبلغ أكبر من المتبقي ('+f(r)+')';return}
var bal=s==='الصندوق'?S.fund:mem(s).b;if(a>bal){e.textContent='الرصيد غير كافٍ في '+s;return}
if(s==='الصندوق')S.fund-=a;else mem(s).b-=a;if(mem(d.cred))mem(d.cred).b+=a;d.paid+=a;
S.log.push({t:'debtpay',who:s==='الصندوق'?d.debtor:s,amt:a,txt:'تسديد دين: '+d.cred,ts:Date.now()});toast(d.paid>=d.amt?'تم دفع الدين بالكامل':'تم تسديد جزء من الدين');render()}
function rep(){var from=Date.now()-{day:1,week:7,month:30,year:365}[per]*D,ex=S.log.filter(function(e){return e.t==='expense'&&e.ts>=from}),tot=ex.reduce(function(a,e){return a+e.amt},0),inc=sum('income',from),by={},who={};
ex.forEach(function(e){by[e.cat]=(by[e.cat]||0)+e.amt;who[e.who]=(who[e.who]||0)+e.amt});
function bars(o){var k=Object.keys(o).sort(function(a,b){return o[b]-o[a]});return k.length?k.map(function(x){return '<div style="margin-bottom:10px"><div class="row"><span>'+esc(x)+'</span><b>'+f(o[x])+'</b></div><div class="bar"><i style="width:'+Math.round(o[x]/tot*100)+'%"></i></div></div>'}).join(''):'<div class="sub">لا توجد مصروفات في هذه الفترة.</div>'}
var h='<div class="chips">'+[['day','اليوم'],['week','الأسبوع'],['month','الشهر'],['year','السنة']].map(function(p){return '<button class="'+(per===p[0]?'on':'')+'" onclick="per=\''+p[0]+'\';render()">'+p[1]+'</button>'}).join('')+'</div>';
h+='<div class="grid"><div class="m"><small>الدخل</small><b class="pos">'+f(inc)+'</b></div><div class="m"><small>المصروفات</small><b class="neg">'+f(tot)+'</b></div></div><div class="m" style="margin-bottom:10px"><small>المتبقي</small><b>'+f(inc-tot)+'</b></div>';
h+='<h2>حسب نوع المصروف</h2><div class="card">'+bars(by)+'</div><h2>حسب الفرد</h2><div class="card">'+bars(who)+'</div><h2>أهداف الادخار</h2>';
h+=S.goals.map(function(g,i){var p=Math.min(100,Math.round(g.sv/g.tg*100));return '<div class="card"><div class="row"><b>'+esc(g.n)+'</b><span class="tag">'+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="sub" style="margin-top:6px">'+f(g.sv)+' من '+f(g.tg)+' · المتبقي '+f(Math.max(0,g.tg-g.sv))+'</div></div>'}).join('');
h+='<div class="card"><label>هدف جديد</label><div class="mini"><input id="gn" placeholder="مثال: السفر"><input id="gt" type="number" inputmode="numeric" placeholder="المبلغ"></div><button class="p" style="margin-top:8px;width:100%" onclick="addG()">إنشاء هدف</button><div class="err" id="e3"></div></div>';return h}
function addG(){var n=$('gn').value.trim(),t=+$('gt').value;if(!n||!(t>0)){$('e3').textContent='أدخل اسم الهدف ومبلغاً صحيحاً';return}S.goals.push({n:n,tg:t,sv:0});toast('تم إنشاء الهدف');render()}
function lg(){var l=S.log.slice().reverse().filter(function(e){return ft==='all'||e.t===ft});
var h='<div class="chips">'+[['all','الكل'],['income','دخل'],['expense','مصروف'],['withdraw','سحب'],['transfer','تحويل'],['debt','دين'],['debtpay','تسديد'],['goal','ادخار']].map(function(p){return '<button class="'+(ft===p[0]?'on':'')+'" onclick="ft=\''+p[0]+'\';render()">'+p[1]+'</button>'}).join('')+'</div>';
return h+'<div class="card">'+(l.length?l.map(ent).join(''):'<div class="sub">لا توجد عمليات من هذا النوع.</div>')+'</div>'}
function render(){var t={home:'مصروف البيت',fam:'العائلة',debt:'الديون',rep:'التقارير',log:'سجل العمليات'};
$('main').innerHTML='<div class="top"><h1>'+t[pg]+'</h1><span class="tag">عائلة الأب</span></div>'+({home:home,fam:fam,debt:debt,rep:rep,log:lg})[pg]();
$('nav').innerHTML=pages.map(function(p){return '<button class="'+(pg===p[0]?'on':'')+'" onclick="pg=\''+p[0]+'\';render();scrollTo(0,0)">'+ico(p[2])+p[1]+'</button>'}).join('')}
function openSh(t){typ=t;drawSh();$('ov').classList.add('show')}
function closeSh(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',function(e){if(e.target===this)closeSh()});
$('fab').onclick=function(){openSh(typ)};
function drawSh(){var n=names(),h='<div class="row"><b style="font-size:17px">إضافة عملية</b><button onclick="closeSh()" aria-label="إغلاق">✕</button></div><div class="chips" style="margin-top:10px">'+Object.keys(types).map(function(k){return '<button class="'+(typ===k?'on':'')+'" onclick="typ=\''+k+'\';drawSh()">'+types[k]+'</button>'}).join('')+'</div>';
var wl={income:'من أضاف المبلغ',expense:'من قام بالدفع',withdraw:'من يسحب',transfer:'المرسل',debt:'المدين',goal:''}[typ];
if(wl)h+='<label>'+wl+'</label><select id="who">'+opts(n)+'</select>';
if(typ==='transfer')h+='<label>المستلم</label><select id="to">'+opts(n.slice(1).concat(n[0]))+'</select>';
if(typ==='expense')h+='<label>نوع المصروف</label><select id="cat">'+opts(cats)+'</select><label>مصدر الدفع</label><select id="src"><option>صندوق البيت</option><option>رصيدي الشخصي</option></select>';
if(typ==='debt')h+='<label>صاحب الدين (شخص أو محل)</label><input id="cr" placeholder="مثال: محل أبو علي">';
if(typ==='goal')h+='<label>الهدف</label><select id="gl">'+opts(S.goals.map(function(g){return g.n}))+'</select>';
h+='<label>المبلغ (د.ع)</label><input id="am" type="number" inputmode="numeric" placeholder="50000"><label>ملاحظة (اختيارية)</label><input id="nt" placeholder="مثال: خضار وفواكه"><div class="err" id="er"></div><button class="p" style="width:100%" onclick="save()">تأكيد العملية</button>';$('sh').innerHTML=h}
function save(){var a=+$('am').value,er=$('er'),w=$('who')?$('who').value:'',nt=$('nt').value.trim(),ts=Date.now(),e;
if(!(a>0)){er.textContent='أدخل مبلغاً أكبر من صفر';return}
if(typ==='income'){S.fund+=a;e={t:'income',who:w,amt:a,txt:nt||'إضافة دخل',ts:ts}}
else if(typ==='expense'){var fd=$('src').value==='صندوق البيت',cat=$('cat').value;if(a>(fd?S.fund:mem(w).b)){er.textContent='الرصيد غير كافٍ';return}
if(fd)S.fund-=a;else mem(w).b-=a;e={t:'expense',who:w,amt:a,txt:nt||cat,cat:cat,ts:ts}}
else if(typ==='withdraw'){if(a>S.fund){er.textContent='رصيد الصندوق غير كافٍ';return}S.fund-=a;mem(w).b+=a;e={t:'withdraw',who:w,amt:a,txt:nt||'سحب من الصندوق',ts:ts}}
else if(typ==='transfer'){var to=$('to').value;if(to===w){er.textContent='اختر مستلماً مختلفاً عن المرسل';return}if(a>mem(w).b){er.textContent='رصيد المرسل غير كافٍ';return}
mem(w).b-=a;mem(to).b+=a;e={t:'transfer',who:w,amt:a,txt:'تحويل إلى '+to+(nt?' - '+nt:''),ts:ts}}
else if(typ==='debt'){var cr=$('cr').value.trim();if(!cr){er.textContent='اكتب اسم صاحب الدين';return}S.debts.push({id:Date.now(),debtor:w,cred:cr,amt:a,paid:0,ts:ts});e={t:'debt',who:w,amt:a,txt:'دين لـ '+cr,ts:ts}}
else{var g=S.goals.filter(function(x){return x.n===$('gl').value})[0];if(!g){er.textContent='أنشئ هدفاً أولاً من صفحة التقارير';return}if(a>S.fund){er.textContent='رصيد الصندوق غير كافٍ';return}S.fund-=a;g.sv+=a;e={t:'goal',who:'صندوق البيت',amt:a,txt:'ادخار: '+g.n,ts:ts}}
S.log.push(e);closeSh();toast('تم حفظ العملية');render()}
render();
</script>
